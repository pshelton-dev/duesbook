<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #f4f5f2; }
    a { color: #2e7d46; } a:hover { color: #256339; }
    .pip { height: 4px; border-radius: 2px; flex: 1; background: #dcecdf; }
    .pip.on { background: #2e7d46; }
    .opt { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid #f0f2ee; min-height: 62px; }
    .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #dde3dc; flex-shrink: 0; }
    .radio.on { border-color: #2e7d46; background: radial-gradient(circle, #2e7d46 0 6px, #fff 7px); }
    .col { font-size: 15px; font-weight: 600; }
    .sample { font-size: 12px; color: #8a938c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f4f5f2; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #16281a; font-size: 14px;">

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 54px 16px 34px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="color: #6f7a72; font-size: 15px; font-weight: 600; min-height: 44px; display: flex; align-items: center;">Cancel</div>
      <div style="font-size: 15px; font-weight: 700;">Import from bank file</div>
      <div style="width: 52px;"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: 0 4px 14px rgba(20, 60, 30, 0.06); font-size: 13px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2e7d46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg>
      <div style="flex: 1; font-weight: 600;">checking-sep-2026.csv</div>
      <div style="color: #8a938c;">41 rows · Checking</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 6px;"><div class="pip on"></div><div class="pip on"></div><div class="pip"></div><div class="pip"></div></div>
      <div style="font-size: 11px; font-weight: 600; color: #8a938c;">Step 2 of 4 · Map columns</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px;">Which column is the date?</div>
      <div style="font-size: 13px; color: #6f7a72;">A value from your file is shown under each column name.</div>
    </div>

    <div style="background: #fff; border-radius: 14px; box-shadow: 0 4px 14px rgba(20, 60, 30, 0.06); display: flex; flex-direction: column;">
      <div class="opt"><div class="radio on"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 3px;"><div class="col">Date</div><div class="sample">08/28/2026</div></div><div style="font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #e3f2e6; color: #2e7d46;">Best guess</div></div>
      <div class="opt"><div class="radio"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 3px;"><div class="col">Description</div><div class="sample">SUNRISE SEED CO 4471</div></div></div>
      <div class="opt"><div class="radio"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 3px;"><div class="col">Amount</div><div class="sample">-42.83</div></div></div>
      <div class="opt" style="border-bottom: none;"><div class="radio"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 3px;"><div class="col">Balance</div><div class="sample">1999.34</div></div></div>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; background: #fff; border: 1px solid #dde3dc; border-radius: 12px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">Back</div>
      <div style="flex: 2; background: #2e7d46; color: #fff; border-radius: 12px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;">Next</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
