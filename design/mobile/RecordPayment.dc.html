<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #f4f5f2; }
    a { color: #2e7d46; } a:hover { color: #256339; }
    .lbl { font-size: 11px; font-weight: 600; color: #8a938c; }
    .fld { background: #fff; border: 1px solid #dde3dc; border-radius: 9px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 15px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f4f5f2; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #16281a; font-size: 14px;">

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 58px 16px 0; display: flex; flex-direction: column; gap: 14px; opacity: 0.55;">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 0;">
      <div style="font-size: 23px; font-weight: 700; letter-spacing: -0.3px;">Dues</div>
      <div style="background: #fff; border: 1px solid #dde3dc; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600;">Sep 2026 · $10.00</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <div style="background: #fff; border-radius: 14px; padding: 14px 12px; height: 62px;"></div>
      <div style="background: #fff; border-radius: 14px; padding: 14px 12px; height: 62px;"></div>
      <div style="background: linear-gradient(135deg, #379a55, #2e7d46); border-radius: 14px; height: 62px;"></div>
    </div>
    <div style="background: #fff; border-radius: 14px; height: 120px;"></div>
  </div>

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(22, 40, 26, 0.35);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #f4f5f2; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(20, 60, 30, 0.18); padding: 10px 16px 34px; display: flex; flex-direction: column; gap: 16px;">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #dde3dc; align-self: center;"></div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px;">Record payment</div>
      <div style="font-size: 15px; font-weight: 600; color: #6f7a72; min-height: 44px; display: flex; align-items: center;">Cancel</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="lbl">Member</div>
      <div style="background: #fff; border-radius: 14px; box-shadow: 0 4px 14px rgba(20, 60, 30, 0.06); display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f0f2ee; min-height: 56px;">
          <div style="display: flex; flex-direction: column; gap: 3px;">
            <div style="font-size: 15px; font-weight: 600;">Maria Alvarez</div>
            <div style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #c1523f;"><div style="width: 7px; height: 7px; border-radius: 50%; background: currentColor;"></div>Owes $10.00 for Sep 2026</div>
          </div>
          <div style="width: 96px; height: 44px; border: 1px solid #dde3dc; border-radius: 9px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; background: #fff;">10.00</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 0 16px; min-height: 44px; font-size: 14px; font-weight: 600; color: #2e7d46;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add another member
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="lbl">Into account</div>
      <div class="fld"><span>Cash box</span><span style="font-size: 12px; color: #8a938c;">last used</span></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="lbl">Date</div>
        <div class="fld"><span>Today, Sep 13</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="lbl">Check # / note</div>
        <div class="fld" style="color: #8a938c;"><span>optional</span></div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 0;">
      <div style="font-size: 13px; color: #6f7a72;">Total</div>
      <div style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">$10.00</div>
    </div>

    <div style="background: #2e7d46; color: #fff; border-radius: 12px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;">Save payment</div>
  </div>
</div>
</x-dc>
</body>
</html>
