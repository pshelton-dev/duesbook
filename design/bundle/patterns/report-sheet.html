<!-- @dsCard group="Patterns" name="Report sheet" subtitle="Print-ready — serif masthead, ruled totals" width="820" height="680" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Duesbook — Report sheet</title>
<style>* {
  box-sizing: border-box;
  margin: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  color: #1a1a1a;
  background: #fff;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 200px;
  flex-shrink: 0;
  background: #f4f4f2;
  border-right: 1px solid #ddd;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.brand {
  font-size: 16px;
  font-weight: 600;
  padding: 8px 12px 16px;
}

.nav-item {
  text-align: left;
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  background: transparent;
  font-size: 14px;
  cursor: pointer;
  color: #1a1a1a;
}

.nav-item:hover {
  background: #e8e8e4;
}

.nav-item.active {
  background: #dce8dc;
  font-weight: 600;
}

.content {
  flex: 1;
  padding: 24px 32px;
  overflow-y: auto;
}

h1 {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 16px;
}

.panel {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  max-width: 640px;
}

.panel.notice {
  background: #f4f9f4;
  border-color: #b8d4b8;
}

.panel.error {
  background: #fbeeee;
  border-color: #d9a0a0;
}

.meta-panel {
  color: #666;
  font-size: 12px;
  line-height: 1.8;
}

.panel.warn {
  background: #fdf6ec;
  border-color: #e0c48c;
}

h2 {
  font-size: 15px;
  font-weight: 600;
  margin: 16px 0 8px;
}

.lead {
  color: #444;
  margin-bottom: 16px;
  max-width: 560px;
  line-height: 1.5;
}

.hint {
  color: #777;
  font-size: 12px;
  margin-top: 4px;
  max-width: 480px;
  line-height: 1.4;
}

.wizard-backdrop {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f4f4f2;
}

.wizard {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  width: 720px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
}

.wizard-steps {
  display: flex;
  gap: 4px;
  padding: 16px 24px 0;
  border-bottom: 1px solid #eee;
  padding-bottom: 12px;
}

.wizard-step {
  font-size: 12px;
  color: #999;
  padding: 4px 10px;
  border-radius: 12px;
}

.wizard-step.current {
  background: #dce8dc;
  color: #1a1a1a;
  font-weight: 600;
}

.wizard-step.done {
  color: #4a7a4a;
}

.wizard-step-num {
  font-weight: 600;
}

.wizard-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
}

.wizard-footer {
  display: flex;
  justify-content: space-between;
  padding: 16px 24px;
  border-top: 1px solid #eee;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 12px;
  max-width: 360px;
}

.field input,
.field select {
  font-size: 14px;
  padding: 7px 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-family: inherit;
}

.field input:focus,
.field select:focus {
  outline: 2px solid #9dbf9d;
  border-color: #9dbf9d;
}

.field-row {
  display: flex;
  gap: 16px;
}

.check-field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  margin-bottom: 16px;
}

.btn {
  font-size: 13px;
  padding: 7px 14px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-family: inherit;
}

.btn:hover {
  background: #f4f4f2;
}

.btn.primary {
  background: #3b6d3b;
  border-color: #3b6d3b;
  color: #fff;
  font-weight: 600;
}

.btn.primary:hover {
  background: #2f572f;
}

.btn:disabled {
  opacity: 0.5;
  cursor: default;
}

.btn.small {
  font-size: 12px;
  padding: 3px 8px;
}

.add-form {
  display: flex;
  gap: 12px;
  align-items: flex-end;
  flex-wrap: wrap;
}

.add-form .field {
  margin-bottom: 0;
  max-width: 160px;
}

.add-form .btn {
  margin-bottom: 1px;
}

.mini-table {
  border-collapse: collapse;
  width: 100%;
  margin-bottom: 16px;
  font-size: 13px;
}

.mini-table th,
.mini-table td {
  text-align: left;
  padding: 6px 10px;
  border-bottom: 1px solid #eee;
}

.mini-table th {
  font-weight: 600;
  color: #666;
  font-size: 12px;
}

.mini-table .num {
  text-align: right;
}

.mapping-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0 16px;
}

code {
  background: #f4f4f2;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 12px;
}

.ledger-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 12px;
}

.account-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.account-tab {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 8px 14px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  font-family: inherit;
}

.account-tab.active {
  border-color: #3b6d3b;
  background: #f4f9f4;
}

.account-tab-name {
  font-size: 13px;
  font-weight: 600;
}

.account-tab-balance {
  font-size: 12px;
  color: #666;
}

.filter-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.filter-bar input,
.filter-bar select {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-family: inherit;
}

.filter-search {
  width: 200px;
}

.filter-sep {
  color: #999;
  font-size: 12px;
}

.check-field.compact {
  margin-bottom: 0;
  font-size: 13px;
}

.register {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}

.register th,
.register td {
  text-align: left;
  padding: 7px 10px;
  border-bottom: 1px solid #eee;
}

.register th {
  font-weight: 600;
  color: #666;
  font-size: 12px;
  position: sticky;
  top: 0;
  background: #fff;
}

.register .num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.register .center {
  text-align: center;
}

.register .nowrap {
  white-space: nowrap;
}

.register .memo {
  color: #777;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.register .pos {
  color: #2f6f2f;
}

.register .balance {
  color: #666;
}

.register-row {
  cursor: pointer;
}

.register-row:hover {
  background: #fafaf8;
}

.badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 8px;
  margin-left: 6px;
  vertical-align: 1px;
}

.badge.ok {
  background: #dce8dc;
  color: #2f572f;
}

.badge.warn {
  background: #fdf6ec;
  color: #8a6420;
  border: 1px solid #e0c48c;
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 380px;
  background: #fff;
  border-left: 1px solid #ddd;
  box-shadow: -4px 0 16px rgba(0, 0, 0, 0.08);
  padding: 20px 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.drawer-header h2 {
  margin: 0;
}

.drawer-footer {
  display: flex;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 16px;
}

.btn.danger {
  color: #a32d2d;
  border-color: #d9a0a0;
}

.btn.danger:hover {
  background: #fbeeee;
}

.segmented {
  display: flex;
  border: 1px solid #ccc;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 16px;
}

.segment {
  flex: 1;
  padding: 7px 0;
  border: none;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  border-right: 1px solid #ccc;
}

.segment:last-child {
  border-right: none;
}

.segment.active {
  background: #3b6d3b;
  color: #fff;
  font-weight: 600;
}

.btn-row {
  display: flex;
  gap: 8px;
}

.chip {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: 6px;
  white-space: nowrap;
}

td .chip:first-child,
th .chip:first-child {
  margin-left: 0;
}

.chip-paid {
  background: #dce8dc;
  color: #2f572f;
}

.chip-partial {
  background: #fdf6ec;
  color: #8a6420;
  border: 1px solid #e0c48c;
}

.chip-owed {
  background: #fbeeee;
  color: #a32d2d;
}

.chip-waived,
.chip-exempt {
  background: #eef0f4;
  color: #4a5568;
}

.chip-na {
  background: #f1f1ef;
  color: #999;
}

.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}

.detail-header h1 {
  margin-bottom: 0;
}

.drawer.wide {
  width: 520px;
}

.period-select {
  font-size: 14px;
  padding: 7px 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-family: inherit;
  font-weight: 600;
}

.summary-bar {
  display: flex;
  gap: 32px;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px 20px;
  margin-bottom: 12px;
}

.summary-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.summary-label {
  font-size: 11px;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.summary-value {
  font-size: 18px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.summary-value.pos {
  color: #2f6f2f;
}

.unallocated-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  font-size: 13px;
}

.row-actions {
  white-space: nowrap;
  text-align: right;
}

.row-actions .btn {
  margin-left: 6px;
}

.typeahead {
  border: 1px solid #ccc;
  border-radius: 6px;
  margin: -8px 0 12px;
  max-width: 360px;
  overflow: hidden;
}

.typeahead-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 7px 10px;
  border: none;
  border-bottom: 1px solid #eee;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}

.typeahead-item:last-child {
  border-bottom: none;
}

.typeahead-item:hover {
  background: #f4f9f4;
}

.amount-input {
  width: 90px;
  text-align: right;
  font-size: 13px;
  padding: 4px 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-family: inherit;
}

.report-controls .segmented {
  max-width: 520px;
}

.report-page {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 32px 40px;
  max-width: 720px;
  background: #fff;
}

.report-head {
  border-bottom: 2px solid #1a1a1a;
  padding-bottom: 12px;
  margin-bottom: 20px;
  font-family: Georgia, 'Times New Roman', serif;
}

.report-org {
  font-size: 20px;
  font-weight: 700;
}

.report-title {
  font-size: 15px;
  margin-top: 2px;
}

.report-sub {
  font-size: 12px;
  color: #555;
  margin-top: 2px;
}

.report-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
  margin-bottom: 20px;
}

.report-table th,
.report-table td {
  text-align: left;
  padding: 5px 8px;
  border-bottom: 1px solid #ddd;
}

.report-table th {
  font-weight: 600;
  border-bottom: 2px solid #1a1a1a;
}

.report-table .num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.report-table .total-row td {
  font-weight: 600;
  border-top: 2px solid #1a1a1a;
  border-bottom: none;
}

.report-columns {
  display: flex;
  gap: 24px;
  align-items: flex-start;
}

.report-columns .report-table {
  flex: 1;
}

.report-net {
  font-size: 14px;
  text-align: right;
}

.settings h2 {
  margin-top: 24px;
}

.balance-cards {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 16px 0;
}

.balance-card {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 14px 20px;
  min-width: 150px;
}

.balance-card.total {
  background: #f4f9f4;
  border-color: #b8d4b8;
}

.dues-progress {
  max-width: 640px;
}

.dues-progress-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 13px;
  margin-bottom: 8px;
}

.progress-track {
  height: 8px;
  border-radius: 4px;
  background: #eee;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #3b6d3b;
  border-radius: 4px;
}

.arrears-list {
  margin: 8px 0;
  padding-left: 20px;
  font-size: 13px;
}

.settings .panel {
  max-width: 640px;
}

.field-static {
  font-size: 13px;
  margin-bottom: 10px;
}

.inactive-row td {
  color: #999;
}

.restore-list {
  margin-top: 12px;
}

@media print {
  body * {
    visibility: hidden;
  }
  .report-page,
  .report-page * {
    visibility: visible;
  }
  .report-page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    border: none;
    padding: 0;
    max-width: none;
  }
}

.pv-pad { padding: 20px; }
.pv-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.pv-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; margin: 14px 0 6px; }
.sw-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sw { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
.sw-chip { height: 44px; }
.sw-meta { padding: 6px 8px; font-size: 11px; line-height: 1.5; }
.sw-meta b { display: block; font-size: 12px; }
body{background:#fafaf8;}</style></head>
<body><div class="pv-pad">
<div class="report-page">
  <div class="report-head">
    <div class="report-org">Maple Grove Garden Club</div>
    <div class="report-title">Treasurer’s Report</div>
    <div class="report-sub">June 1 – June 30, 2026 · generated July 9, 2026</div>
  </div>
  <div class="report-columns">
    <table class="report-table">
      <thead><tr><th>Income</th><th class="num">Amount</th></tr></thead>
      <tbody>
        <tr><td>Dues</td><td class="num">$250.00</td></tr>
        <tr><td>Plant sale</td><td class="num">$412.00</td></tr>
        <tr class="total-row"><td>Total income</td><td class="num">$662.00</td></tr>
      </tbody>
    </table>
    <table class="report-table">
      <thead><tr><th>Expenses</th><th class="num">Amount</th></tr></thead>
      <tbody>
        <tr><td>Printing</td><td class="num">$84.00</td></tr>
        <tr><td>Utilities</td><td class="num">$63.20</td></tr>
        <tr class="total-row"><td>Total expenses</td><td class="num">$147.20</td></tr>
      </tbody>
    </table>
  </div>
  <div class="report-net"><strong>Net for period: $514.80</strong></div>
</div></div></body></html>
